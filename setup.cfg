[metadata]
name = agent-memory-workbench
version = 0.1.0
description = Auditable, file-first memory infrastructure for AI agents
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Agent Memory Workbench contributors
author_email = yanyan1115@users.noreply.github.com
url = https://github.com/yanyan1115/agent-memory-workbench
project_urls =
    Source = https://github.com/yanyan1115/agent-memory-workbench
    Issues = https://github.com/yanyan1115/agent-memory-workbench/issues

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    PyYAML>=6.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    memoryctl = agent_memory_workbench.lifecycle:main
    memsearch = agent_memory_workbench.search:main
    memory-recall = agent_memory_workbench.recall:main
    memory-mirror = agent_memory_workbench.mirror:main

[options.extras_require]
dev =
    build
